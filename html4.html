<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>External Link Warning</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #f97316;
    --accent-hover: #ea580c;
    --cancel: #334155;
    --cancel-hover: #475569;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }

  a.outbound-link {
    color: var(--accent);
    font-size: 1.1rem;
    text-decoration: none;
    border-bottom: 1px dashed var(--accent);
    padding-bottom: 2px;
  }

  a.outbound-link:hover {
    color: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  /* Overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.15s ease-out;
  }

  .modal-overlay.active {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Modal box */
  .modal-box {
    background: var(--card);
    border-radius: 12px;
    padding: 28px;
    max-width: 380px;
    width: 90%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    animation: popIn 0.15s ease-out;
  }

  @keyframes popIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-icon {
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .modal-box h2 {
    margin: 0 0 10px;
    font-size: 1.15rem;
  }

  .modal-box p {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.5;
    word-break: break-word;
  }

  .modal-box p span.url {
    color: var(--text);
    font-weight: 600;
  }

  .modal-buttons {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-cancel {
    background: var(--cancel);
    color: var(--text);
  }

  .btn-cancel:hover {
    background: var(--cancel-hover);
  }

  .btn-ok {
    background: var(--accent);
    color: white;
    font-weight: 600;
  }

  .btn-ok:hover {
    background: var(--accent-hover);
  }
</style>
</head>
<body>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <h2>You're about to leave this page</h2>
      <p>This link will open <span class="url" id="targetUrlDisplay"></span> in a new tab. Do you want to continue?</p>
      <div class="modal-buttons">
        <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
        <button class="btn btn-ok" id="okBtn">OK, continue</button>
      </div>
    </div>
  </div>

  <script>
    // Set the destination URL here
    const TARGET_URL = 'https://opendata.cern.ch/search?q=&f=experiment%3ACMS';

    const modalOverlay = document.getElementById('modalOverlay');
    const targetUrlDisplay = document.getElementById('targetUrlDisplay');
    const okBtn = document.getElementById('okBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    let pendingUrl = TARGET_URL;

    // Show the warning modal immediately on page load
    window.addEventListener('DOMContentLoaded', function () {
      targetUrlDisplay.textContent = pendingUrl;
      modalOverlay.classList.add('active');
    });

    okBtn.addEventListener('click', function () {
      modalOverlay.classList.remove('active');
      if (pendingUrl) {
        window.open(pendingUrl, '_blank', 'noopener,noreferrer');
      }
    });

    cancelBtn.addEventListener('click', function () {
      modalOverlay.classList.remove('active');
      pendingUrl = '';
    });

    // Close modal if clicking outside the box
    modalOverlay.addEventListener('click', function (e) {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
        pendingUrl = '';
      }
    });

    // Close modal with Escape key
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
        modalOverlay.classList.remove('active');
        pendingUrl = '';
      }
    });
  </script>

</body>
</html>
