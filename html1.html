<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11 - Dark Mode</title>
<style>
    :root {
        --text: #f3f3f3;
        --stroke: rgba(255, 255, 255, 0.1);
        --taskbar-h: 48px;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
        font-family: "Segoe UI Variable", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
        user-select: none;
        background: #000;
        color: var(--text);
    }

    body {
        display: flex;
        flex-direction: column;
    }

    .screen {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
        background: #000;
        overflow: hidden;
    }
    .screen iframe {
        width: 100%;
        height: 100%;
        border: 0;
        margin: 0;
        padding: 0;
        display: block;
        background: #000;
    }

    .fallback-msg {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        text-align: center;
        padding: 24px;
    }
    .fallback-msg.active { display: flex; }
    .fallback-msg span { color: rgba(255,255,255,0.6); font-size: 14px; max-width: 420px; }
    .fallback-msg a {
        color: #60cdff;
        text-decoration: none;
        font-size: 14px;
        border: 1px solid rgba(96,205,255,0.4);
        padding: 8px 16px;
        border-radius: 6px;
    }
    .fallback-msg a:hover { background: rgba(96,205,255,0.1); }

    .blank-screen {
        position: absolute;
        inset: 0;
        background: #000;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
    }
    .blank-screen.active { display: flex; }
    .blank-screen span {
        color: rgba(255,255,255,0.4);
        font-size: 13px;
        letter-spacing: 0.5px;
    }

    .taskbar {
        flex: 0 0 var(--taskbar-h);
        height: var(--taskbar-h);
        background: #1f1f1f;
        border-top: 1px solid var(--stroke);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
    }

    .power-btn {
        width: 40px;
        height: 40px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s ease;
    }
    .power-btn:hover {
        background: rgba(255, 255, 255, 0.1);
    }
    .power-btn:active {
        background: #e81123;
    }
    .power-btn svg {
        width: 20px;
        height: 20px;
        stroke: var(--text);
        fill: none;
        stroke-width: 1.8;
    }
</style>
</head>
<body>

    <div class="screen" id="screen-area">
        <iframe id="main-frame" allowfullscreen></iframe>
        <div class="fallback-msg" id="fallback-msg">
            <span>This site can't be embedded directly (it blocks being shown in a frame).</span>
            <a id="fallback-link" href="#" target="_blank" rel="noopener">Open it in a new tab</a>
        </div>
    </div>

    <div class="blank-screen" id="blank-screen">
        <span>You can close this tab now.</span>
    </div>

    <div class="taskbar">
        <button class="power-btn" id="power-btn" title="Power" onclick="powerOff()">
            <svg viewBox="0 0 24 24">
                <path d="M12 2v8"/>
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
            </svg>
        </button>
    </div>

    <script>
        // ================================================================
        // YOUR LINK — edit here if you need to change it
        // ================================================================
        const LINK_URL = "https://cds.cern.ch/collection/ALICE?ln=en";

        const frame = document.getElementById('main-frame');
        const fallback = document.getElementById('fallback-msg');
        document.getElementById('fallback-link').href = LINK_URL;

        frame.src = LINK_URL;

        setTimeout(() => {
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc || doc.body === null || doc.location.href === 'about:blank') {
                    fallback.classList.add('active');
                }
            } catch (e) {
                // Cross-origin access throwing here is normal and expected
                // for a page that loaded successfully — do nothing.
            }
        }, 3000);

        function powerOff() {
            document.getElementById('blank-screen').classList.add('active');
            document.getElementById('screen-area').style.display = 'none';
            window.close();
        }
    </script>

</body>
</html>
